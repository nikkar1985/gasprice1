<!DOCTYPE html>
<html>
<head>
  <title>With JSON ready</title>
  <style>
  
  </style>
</head>

<body>
<div class="dashboard" id="main-content">
  <h2>Fuel Stats</h2>
  <div id="stats-container">Φόρτωση Δεδομένων...</div>
</div>

<script>
fetch('data.json')
  .then(response => {
    if(!response.ok) throw new Error("Το αρχείο data.json δεν βρέθηκε");
    return response.json();
  })
  .then(data => { 
    const container = document.getElementById('stats-container');
    container.innerHTML = `<div class="stats-item">Τύπος: ${data.fuel_type}</div>`;
  })
  .catch(error => {
    document.getElementById('stats-container').innerText = "Σφάλμα: " + error.message;
  });
</script>
  
</body>
</html>
